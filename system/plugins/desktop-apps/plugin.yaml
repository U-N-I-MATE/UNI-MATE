name: Điều khiển app trên máy
name_en: "Control apps on this computer"
slug: desktop-apps
version: 1.0.0
description: Mở, đóng và liệt kê ứng dụng trên CHÍNH MÁY đang chạy UNI MATE (Windows, macOS, Linux có màn hình) theo lời người dùng, ví dụ "mở Chrome", "tắt Excel", "đang mở app nào". Tự chặn và nói rõ khi UNI MATE chạy trong Docker trên máy chủ, vì khi đó máy chạy UNI MATE không phải máy của người dùng.
description_en: "Opens, closes and lists apps on THE MACHINE running UNI MATE (Windows, macOS, Linux with a screen) when you ask, e.g. \"open Chrome\", \"close Excel\", \"which apps are open\". Blocks itself and says so when UNI MATE runs in Docker on a server, because then the machine running UNI MATE is not yours."
author: UNI MATE (bundled)
enabled: true
min_mode: safe
tools:
  - unimate_app_list
  - unimate_app_open
  - unimate_app_close
hooks: []
