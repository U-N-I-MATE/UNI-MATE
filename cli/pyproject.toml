[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unimate-cli"
version = "0.17.0"
description = "UNI MATE CLI - nói chuyện với UNI MATE từ terminal"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "U.N.I SERVICE AND TRADING CO., LTD." }]
keywords = ["unimate", "cli", "ai", "agent", "second-brain"]

# CHỈ httpx. Đây là một luật, không phải sự tình cờ: gói này phải cài được trên máy chưa từng
# có UNI MATE, và mọi thứ kéo thêm (fastapi, uvicorn, rich...) đều là thứ người dùng phải tải về
# chỉ để gõ một câu hỏi. Có test canh đúng danh sách này.
dependencies = ["httpx>=0.24"]

[project.urls]
Homepage = "https://github.com/U-N-I-MATE/UNI-MATE"
Documentation = "https://github.com/U-N-I-MATE/UNI-MATE/blob/main/docs/dev/2026-08-cli-spec.md"

[project.scripts]
unimate = "unimate_cli.__main__:main"

[tool.setuptools.packages.find]
include = ["unimate_cli*"]
